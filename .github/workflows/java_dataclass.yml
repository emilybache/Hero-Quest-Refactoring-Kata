name: Test java_dataclass

on:
  push:
    paths:
      - 'java_dataclass/**'
      - '.github/workflows/java_dataclass.yml'
  pull_request:
    paths:
      - 'java_dataclass/**'
      - '.github/workflows/java_dataclass.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [17, 21, 25]

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}

    - name: Build and test
      working-directory: java_dataclass
      run: mvn -B package

    - name: Run
      working-directory: java_dataclass
      run: mvn compile exec:java
