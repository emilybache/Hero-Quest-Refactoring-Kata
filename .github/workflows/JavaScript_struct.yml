name: Test JavaScript_struct

on:
  push:
    paths:
      - 'JavaScript_struct/**'
      - '.github/workflows/JavaScript_struct.yml'
  pull_request:
    paths:
      - 'JavaScript_struct/**'
      - '.github/workflows/JavaScript_struct.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10, 12, 14, 16, 18, 20, 22]

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Set up dependencies
      working-directory: JavaScript_struct
      run: npm install --force

    - name: Test
      working-directory: JavaScript_struct
      run: npm test

    - name: Run
      working-directory: JavaScript_struct
      run: npm start
